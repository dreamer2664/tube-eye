name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: suite
        run: python3 tests/run_all.py
      - name: intake (offline)
        run: python3 src/intake.py
      - name: scheduler is deterministic
        run: |
          python3 src/scheduler.py
          cp plan/schedule.json /tmp/a.json
          python3 src/scheduler.py
          # generated_at differs by design; compare the slots themselves
          python3 - <<'EOF'
          import json
          a = json.load(open('/tmp/a.json')); b = json.load(open('plan/schedule.json'))
          assert a['slots'] == b['slots'], 'scheduler is not deterministic'
          print('slots stable:', len(a['slots']))
          EOF
